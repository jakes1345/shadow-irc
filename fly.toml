app = "shadow-irc"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "6667"
  WEB_PORT = "8888"

[mounts]
  source = "shadow_data"
  destination = "/app/data"

# HTTP + WebSocket service (web client at app.shadowspace.space)
[[services]]
  internal_port = 8888
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

# Raw TCP IRC (port 6667 for native IRC clients)
# Native IRC clients: TLS only. Fly terminates TLS on 6697 and hands plaintext to the daemon.
[[services]]
  internal_port = 6667
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["tls"]
    port = 6697

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
