<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌌 SHADOW // IRC [Deep Space Network]</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    body { background: #030308; color: #00f3ff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; select: none; }
    canvas#nebula { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
    
    /* Top Cosmic Header */
    header {
      background: rgba(7, 7, 18, 0.9);
      backdrop-filter: blur(10px);
      padding: 10px 18px;
      border-bottom: 1px solid #8a2be2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(138, 43, 226, 0.3);
    }
    h1 { font-size: 16px; color: #ff007f; text-shadow: 0 0 12px #ff007f; letter-spacing: 1.5px; }
    .status-badge { font-size: 12px; color: #00ff66; background: rgba(0, 255, 102, 0.1); border: 1px solid #00ff66; padding: 3px 10px; border-radius: 12px; }

    /* Main Workspace */
    #workspace { display: flex; flex: 1; height: calc(100vh - 95px); }

    /* Channel Tree Sidebar */
    #channel-tree {
      width: 220px;
      background: rgba(7, 7, 18, 0.85);
      backdrop-filter: blur(12px);
      border-right: 1px solid #1d1d3d;
      display: flex;
      flex-direction: column;
    }
    .tree-title { padding: 12px; font-size: 12px; color: #8a2be2; border-bottom: 1px solid #1d1d3d; text-transform: uppercase; font-weight: bold; }
    ul.tree-list { list-style: none; padding: 10px 0; overflow-y: auto; flex: 1; }
    li.tree-item { padding: 10px 16px; cursor: pointer; color: #94a3b8; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
    li.tree-item:hover { background: rgba(138, 43, 226, 0.2); color: #00f3ff; }
    li.tree-item.active { background: rgba(255, 0, 127, 0.25); color: #ff007f; font-weight: bold; border-left: 3px solid #ff007f; }

    /* Central Chat View */
    #chat-view { flex: 1; display: flex; flex-direction: column; background: rgba(3, 3, 8, 0.75); }
    #topic-bar { padding: 8px 16px; background: rgba(20, 20, 43, 0.8); border-bottom: 1px solid #1d1d3d; color: #ffaa00; font-size: 12px; }
    #messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    
    .msg-line { line-height: 1.5; font-size: 13px; word-break: break-word; }
    .msg-time { color: #64748b; font-size: 11px; margin-right: 8px; }
    .msg-nick { color: #00f3ff; font-weight: bold; margin-right: 6px; }
    .msg-action { color: #d000ff; font-style: italic; }
    .msg-notice { color: #ffaa00; }
    .msg-sys { color: #8a2be2; font-weight: bold; }
    .e2e-badge { color: #00ff66; font-size: 10px; border: 1px solid #00ff66; padding: 1px 4px; border-radius: 4px; margin-left: 4px; }

    /* User List Sidebar */
    #user-sidebar {
      width: 200px;
      background: rgba(7, 7, 18, 0.85);
      backdrop-filter: blur(12px);
      border-left: 1px solid #8a2be2;
      padding: 12px;
    }
    .user-title { color: #ff007f; font-size: 12px; margin-bottom: 10px; font-weight: bold; }
    ul.user-list { list-style: none; overflow-y: auto; }
    li.user-item { padding: 6px 0; font-size: 13px; color: #00f3ff; }
    li.user-item.op { color: #ff007f; font-weight: bold; }
    li.user-item.voice { color: #00ffcc; }

    /* Prompt Bar */
    #prompt-bar {
      background: rgba(7, 7, 18, 0.95);
      padding: 10px 16px;
      border-top: 1px solid #00f3ff;
      display: flex;
      gap: 10px;
    }
    input#cmd-input {
      flex: 1;
      background: #070712;
      border: 1px solid #8a2be2;
      color: #00ff41;
      padding: 10px 14px;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }
    input#cmd-input:focus { border-color: #00f3ff; box-shadow: 0 0 10px rgba(0, 243, 255, 0.4); }
    button.send-btn {
      background: linear-gradient(135deg, #8a2be2, #ff007f);
      color: #fff;
      border: none;
      padding: 0 24px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
    }
    button.send-btn:hover { filter: brightness(1.2); }
  </style>
</head>
<body>
  <canvas id="nebula"></canvas>
  <header>
    <h1>🌌 SHADOW // IRC [Deep Space Desktop]</h1>
    <span class="status-badge" id="net-status">ONLINE // TCP 6667</span>
  </header>

  <div id="workspace">
    <!-- Channel Tree Sidebar -->
    <div id="channel-tree">
      <div class="tree-title">CHANNELS & DMS</div>
      <ul class="tree-list" id="chan-list">
        <li class="tree-item active" onclick="switchWindow('status')"># status</li>
        <li class="tree-item" onclick="switchWindow('#cosmos')"># cosmos</li>
        <li class="tree-item" onclick="switchWindow('#quantum')"># quantum</li>
      </ul>
    </div>

    <!-- Main Chat -->
    <div id="chat-view">
      <div id="topic-bar">Topic: Welcome to Deep Space Cosmic Network | E2EE Active</div>
      <div id="messages"></div>
      
      <div id="prompt-bar">
        <input type="text" id="cmd-input" placeholder="Type /join #cosmos, /me floats in space, or /encrypt <key>..." autofocus />
        <button class="send-btn" onclick="sendInput()">SEND</button>
      </div>
    </div>

    <!-- User List -->
    <div id="user-sidebar">
      <div class="user-title">CREW / USERS</div>
      <ul class="user-list" id="user-list">
        <li class="user-item op">@CosmicAI</li>
      </ul>
    </div>
  </div>

  <script>
    // 1. Deep Space Nebula Canvas Particle Dynamics
    const canvas = document.getElementById('nebula');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();

    const particles = Array.from({length: 180}, () => ({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*2.2 + 0.5,
      color: ['#00f3ff','#ff007f','#8a2be2','#00ff66','#ffaa00'][Math.floor(Math.random()*5)],
      speed: Math.random()*0.3 + 0.1
    }));

    function drawNebula() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fill();
        p.y += p.speed;
        if (p.y > canvas.height) p.y = 0;
      });
      requestAnimationFrame(drawNebula);
    }
    drawNebula();

    // 2. IRC Client Protocol Engine over WebSocket Bridge / Native Socket
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(protocol + '//' + (location.host || 'localhost:8888'));
    
    let currentWindow = 'status';
    const windows = new Map();
    windows.set('status', { title: 'status', messages: [], users: new Set() });
    windows.set('#cosmos', { title: '#cosmos', messages: [], users: new Set() });
    windows.set('#quantum', { title: '#quantum', messages: [], users: new Set() });

    let myNick = 'cosmic_user_' + Math.floor(Math.random()*8999+1000);

    ws.onopen = () => {
      document.getElementById('net-status').innerText = 'CONNECTED // ' + myNick;
      ws.send('CAP REQ :server-time echo-message\r\n');
      ws.send('CAP END\r\n');
      ws.send('NICK ' + myNick + '\r\n');
      ws.send('USER ' + myNick + ' 0 * :Shadow Deep Space Desktop Client\r\n');
      ws.send('JOIN #cosmos\r\n');
    };

    ws.onmessage = (e) => {
      const line = e.data.trim();
      const time = new Date().toLocaleTimeString();
      
      // Parse IRC Line
      if (line.includes(' PRIVMSG ')) {
        const nickMatch = line.match(/:([^!]+)!/);
        const sender = nickMatch ? nickMatch[1] : 'system';
        const targetMatch = line.match(/PRIVMSG ([^ ]+) :/);
        const target = targetMatch ? targetMatch[1] : '#cosmos';
        const msgText = line.substring(line.indexOf(' :') + 2);

        if (msgText.includes('\x01ACTION ') || msgText.includes('\\x01ACTION ')) {
          const act = msgText.replace(/\\x01ACTION |\x01ACTION |\\x01|\x01/g, '');
          addMsg(target, '<span class="msg-time">[' + time + ']</span> <span class="msg-action">* ' + escapeHtml(sender) + ' ' + escapeHtml(act) + '</span>');
        } else {
          addMsg(target, '<span class="msg-time">[' + time + ']</span> <span class="msg-nick">&lt;' + escapeHtml(sender) + '&gt;</span> ' + escapeHtml(msgText));
        }
      } else if (line.includes(' 353 ')) {
        const parts = line.split(' :');
        if (parts[1]) {
          const userArr = parts[1].split(' ');
          const userListEl = document.getElementById('user-list');
          userListEl.innerHTML = userArr.map(u => '<li class="user-item ' + (u.startsWith('@')?'op':'voice') + '">' + escapeHtml(u) + '</li>').join('');
        }
      } else {
        addMsg('status', '<span class="msg-time">[' + time + ']</span> <span class="msg-sys">' + escapeHtml(line) + '</span>');
      }
    };

    function addMsg(winName, html) {
      if (!windows.has(winName)) {
        windows.set(winName, { title: winName, messages: [], users: new Set() });
      }
      const win = windows.get(winName);
      win.messages.push(html);

      if (currentWindow === winName) {
        renderMessages();
      }
    }

    function switchWindow(winName) {
      currentWindow = winName;
      document.querySelectorAll('.tree-item').forEach(el => {
        el.classList.toggle('active', el.innerText.includes(winName));
      });
      renderMessages();
    }

    function renderMessages() {
      const msgBox = document.getElementById('messages');
      const win = windows.get(currentWindow);
      msgBox.innerHTML = win ? win.messages.map(m => '<div class="msg-line">' + m + '</div>').join('') : '';
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    function sendInput() {
      const input = document.getElementById('cmd-input');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';

      if (val.startsWith('/me ')) {
        ws.send('PRIVMSG ' + (currentWindow.startsWith('#')?currentWindow:'#cosmos') + ' :\x01ACTION ' + val.substring(4) + '\x01\r\n');
        addMsg(currentWindow, '<span class="msg-time">[' + new Date().toLocaleTimeString() + ']</span> <span class="msg-action">* ' + myNick + ' ' + escapeHtml(val.substring(4)) + '</span>');
      } else if (val.startsWith('/join ')) {
        const chan = val.split(' ')[1];
        ws.send('JOIN ' + chan + '\r\n');
        switchWindow(chan);
      } else if (val.startsWith('/')) {
        ws.send(val.substring(1) + '\r\n');
      } else {
        const target = currentWindow.startsWith('#') ? currentWindow : '#cosmos';
        ws.send('PRIVMSG ' + target + ' :' + val + '\r\n');
        addMsg(target, '<span class="msg-time">[' + new Date().toLocaleTimeString() + ']</span> <span class="msg-nick">&lt;' + myNick + '&gt;</span> ' + escapeHtml(val));
      }
    }

    document.getElementById('cmd-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendInput(); });
    function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  </script>
</body>
</html>`;

    res.writeHead(200, { 'Content-Type': 'text/html' });
    res.end(html);
  }
}
