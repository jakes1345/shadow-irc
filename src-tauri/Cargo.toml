[package]
name = "shadow-irc-desktop"
version = "4.0.0"
description = "SHADOW-IRC Native Deep Space Desktop Application"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "shadow_irc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
