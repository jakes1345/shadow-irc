name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SHADOW // IRC ${{ github.ref_name }}'
          releaseBody: |
            ## SHADOW // IRC — Deep Space Network

            ### Download
            - **Windows**: `.msi` installer
            - **macOS**: `.dmg` (universal — Intel + Apple Silicon)
            - **Linux**: `.AppImage` (portable, no install needed)

            ### Linux quick install
            ```bash
            curl -L https://github.com/jakes1345/shadow-irc/releases/latest/download/SHADOW-IRC_amd64.AppImage -o ~/SHADOW-IRC.AppImage && chmod +x ~/SHADOW-IRC.AppImage && ~/SHADOW-IRC.AppImage
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
